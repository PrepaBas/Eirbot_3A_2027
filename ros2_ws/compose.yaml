services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ros2_container

    network_mode: host
    ipc: host

    working_dir: /ros2_ws

    volumes:
      - "$PWD/src:/ros2_ws/src"
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./rosbot_pro.rviz:/root/.rviz2/default.rviz

    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    command: >
      bash -c "echo 'source /opt/ros/jazzy/setup.bash &&
               source /ros2_ws/install/setup.bash' >> /root/.bashrc &&
               exec sleep infinity"

    stdin_open: true
    tty: true
